<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Messenger</title>
  <meta name="description" content="Send WhatsApp messages with optional PDF attachments quickly and easily." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #25D366;
      --green-dark:   #128C7E;
      --green-light:  #34eb7a;
      --bg:           #0a0f0d;
      --card-bg:      rgba(255,255,255,0.04);
      --border:       rgba(37,211,102,0.18);
      --text:         #e8f5e9;
      --muted:        #6b7a6e;
      --input-bg:     rgba(255,255,255,0.06);
      --shadow:       0 25px 60px rgba(0,0,0,0.6);
      --radius:       16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,211,102,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(18,140,126,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,15,13,0.95) 0%, transparent 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--green); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: var(--green-dark); bottom: -80px; right: -80px; animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(30px) scale(1.05); }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.6s ease both;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      box-shadow: 0 0 40px rgba(37,211,102,0.4);
      margin-bottom: 18px;
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 30px rgba(37,211,102,0.3); }
      50%       { box-shadow: 0 0 55px rgba(37,211,102,0.55); }
    }

    .logo-wrap svg { width: 36px; height: 36px; fill: #fff; }

    .header h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--green), var(--green-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: fadeUp 0.6s ease 0.1s both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      transition: color 0.2s;
      pointer-events: none;
      display: flex;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 14px 16px 14px 44px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      resize: none;
    }

    textarea { padding-left: 16px; min-height: 120px; }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--green);
      background: rgba(37,211,102,0.05);
      box-shadow: 0 0 0 3px rgba(37,211,102,0.1);
    }

    input[type="text"]:focus ~ .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--green);
    }

    input::placeholder, textarea::placeholder { color: var(--muted); }

    /* ── File upload ── */
    .file-drop {
      border: 2px dashed rgba(37,211,102,0.25);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
      background: var(--input-bg);
      position: relative;
    }

    .file-drop:hover, .file-drop.dragover {
      border-color: var(--green);
      background: rgba(37,211,102,0.06);
      transform: scale(1.01);
    }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .file-drop-text { color: var(--muted); font-size: 0.88rem; }
    .file-drop-text span { color: var(--green); font-weight: 600; }

    .file-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--green);
    }

    .file-preview.show { display: flex; }
    .file-preview svg  { flex-shrink: 0; }

    .remove-file {
      margin-left: auto;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.2s;
      padding: 0;
    }
    .remove-file:hover { color: #ef4444; }

    /* ── Submit button ── */
    .btn-send {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 6px 24px rgba(37,211,102,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(37,211,102,0.5);
    }

    .btn-send:active:not(:disabled) { transform: translateY(0); }

    .btn-send:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-send::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
    }

    .btn-send:hover:not(:disabled)::after {
      animation: shimmer 0.6s ease forwards;
    }

    @keyframes shimmer {
      to { transform: translateX(100%); }
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast notifications ── */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      max-width: 320px;
    }

    .toast.success {
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      color: var(--green-light);
    }

    .toast.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px) scale(0.9); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateX(30px) scale(0.9); }
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <!-- WhatsApp Icon -->
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.522.666 4.888 1.83 6.934L2 30l7.294-1.812A13.93 13.93 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6a11.543 11.543 0 01-5.876-1.604l-.422-.252-4.33 1.076 1.096-4.222-.276-.434A11.543 11.543 0 014.4 16c0-6.394 5.206-11.6 11.6-11.6S27.6 9.606 27.6 16 22.394 27.6 16 27.6zm6.36-8.686c-.348-.174-2.062-1.016-2.382-1.132-.32-.116-.552-.174-.784.174-.232.348-.9 1.132-1.104 1.366-.204.232-.406.26-.754.086-.348-.174-1.47-.542-2.8-1.728-1.034-.924-1.732-2.064-1.936-2.412-.204-.348-.022-.536.152-.71.158-.156.348-.406.522-.61.174-.202.232-.348.348-.58.116-.232.058-.436-.028-.61-.088-.174-.784-1.888-1.074-2.586-.284-.682-.572-.59-.784-.6l-.668-.012a1.28 1.28 0 00-.928.436c-.32.348-1.218 1.19-1.218 2.9s1.246 3.364 1.42 3.596c.174.232 2.454 3.746 5.946 5.254.832.36 1.482.574 1.988.734.834.266 1.594.228 2.194.138.67-.1 2.062-.844 2.352-1.66.29-.814.29-1.512.204-1.658-.086-.146-.32-.232-.668-.406z"/>
      </svg>
    </div>
    <h1>WhatsApp Messenger</h1>
    <p>Send messages and PDF attachments instantly</p>
  </div>

  <!-- Card -->
  <div class="card">
    <form id="messageForm" novalidate>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.09a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
          </span>
          <input
            type="text"
            id="phoneNumber"
            name="PhoneNumber"
            placeholder="+92 300 1234567"
            autocomplete="tel"
            required
          />
        </div>
      </div>

      <!-- Message Text -->
      <div class="form-group">
        <label for="messageText">Message</label>
        <textarea
          id="messageText"
          name="MessageText"
          placeholder="Type your message here..."
          required
        ></textarea>
      </div>

      <div class="divider"></div>

      <!-- PDF Upload -->
      <div class="form-group">
        <label>Attachment <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;">(optional · PDF only)</span></label>
        <div class="file-drop" id="fileDrop">
          <input type="file" id="pdfFile" name="Pdf" accept=".pdf" />
          <div class="file-drop-icon">📎</div>
          <div class="file-drop-text">
            Drag & drop PDF here or <span>browse</span>
          </div>
        </div>
        <div class="file-preview" id="filePreview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          <span id="filePreviewName">document.pdf</span>
          <button type="button" class="remove-file" id="removeFile" title="Remove file">✕</button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-send" id="sendBtn">
        <span class="spinner" id="spinner"></span>
        <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <span id="btnText">Send Message</span>
      </button>

    </form>
  </div>

  <div class="footer">
    Powered by WhatsApp Messenger API &nbsp;·&nbsp; All data is encrypted in transit
  </div>

</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
  const form       = document.getElementById('messageForm');
  const sendBtn    = document.getElementById('sendBtn');
  const spinner    = document.getElementById('spinner');
  const sendIcon   = document.getElementById('sendIcon');
  const btnText    = document.getElementById('btnText');
  const fileDrop   = document.getElementById('fileDrop');
  const pdfInput   = document.getElementById('pdfFile');
  const filePreview    = document.getElementById('filePreview');
  const filePreviewName = document.getElementById('filePreviewName');
  const removeFile = document.getElementById('removeFile');

  // ── File drag & drop visual ──
  fileDrop.addEventListener('dragover',  e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
  fileDrop.addEventListener('drop',      e => { e.preventDefault(); fileDrop.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
  pdfInput.addEventListener('change',   () => handleFile(pdfInput.files[0]));

  function handleFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.pdf')) {
      showToast('Only PDF files are allowed.', 'error');
      pdfInput.value = '';
      return;
    }
    filePreviewName.textContent = file.name;
    filePreview.classList.add('show');
  }

  removeFile.addEventListener('click', () => {
    pdfInput.value = '';
    filePreview.classList.remove('show');
  });

  // ── Form submit ──
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const phone   = document.getElementById('phoneNumber').value.trim();
    const message = document.getElementById('messageText').value.trim();

    if (!phone)   { showToast('Please enter a phone number.', 'error'); return; }
    if (!message) { showToast('Please enter a message.', 'error');      return; }

    setLoading(true);

    const formData = new FormData();
    formData.append('PhoneNumber', phone);
    formData.append('MessageText', message);
    if (pdfInput.files[0]) {
      formData.append('Pdf', pdfInput.files[0]);
    }

    try {
      const res  = await fetch('/api/Messages/Send', { method: 'POST', body: formData });
      const data = await res.json();

      if (res.ok && data.success) {
        showToast(`✅ Message saved! (ID: ${data.id})`, 'success');
        form.reset();
        filePreview.classList.remove('show');
      } else {
        showToast(typeof data === 'string' ? data : (data.message || 'Something went wrong.'), 'error');
      }
    } catch (err) {
      showToast('Network error. Please try again.', 'error');
    } finally {
      setLoading(false);
    }
  });

  // ── Helpers ──
  function setLoading(on) {
    sendBtn.disabled   = on;
    spinner.style.display  = on ? 'block' : 'none';
    sendIcon.style.display = on ? 'none'  : 'block';
    btnText.textContent    = on ? 'Sending…' : 'Send Message';
  }

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
        ${type === 'success'
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
      </svg>
      <span>${msg}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.animation = 'toastOut 0.3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }
</script>
</body>
</html>
